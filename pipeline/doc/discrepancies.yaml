# Places where the paper's documentation and the paper's data disagree, or
# where the data looks wrong on its own terms.
#
# Graded deliberately. Only category A is a claim that something is *wrong*;
# B and C are documentation that cannot be built from; D concerns the reported
# results rather than the signals; E exists to record things that look like
# discrepancies and are not, so nobody re-opens them.

categories:

- key: A
  title: An error in the signal itself
  blurb: >
    The construction contradicts the formula the paper states, the wording of
    its own appendix, and the paper it cites, and the difference changes what
    the signal measures.
  items:
  - signal: OA, AOA
    documented: >
      Appendix Table A.1: "Operating Accruals: Changes in non-cash working
      capital minus depreciation (dp), all scaled by lagged total assets."
      Freyberger, Neuhierl and Weber word it identically and cite Sloan (1996),
      whose equation 1 subtracts depreciation.
    implemented: >
      Depreciation sits inside the current-liabilities bracket, so expanding
      gives "+ dp": accruals are computed net of everything except
      depreciation, which is added.
    evidence: >
      Netting depreciation out agrees with the package's own published decile
      weights at 0.286; adding it gives 0.963. Decile one's share of market
      capitalisation comes out at 5.29% against a published 5.30%, and the
      long-leg wedge error falls from +39.9 percentage points to -1.5. AOA, the
      absolute value, goes from 0.041 to 0.971.
    consequence: >
      OA and AOA are not operating accruals. Depreciation is large and
      persistent for capital-intensive firms, so those firms are sorted toward
      the high-accrual leg by their depreciation rather than away from it. The
      sign of the depreciation term is the whole content of Sloan's measure.
    note: >
      Chen and Zimmermann's PctAcc.do carries the identical bracket placement
      while their Accruals.do does not, which suggests both inherited the same
      transcription rather than arriving at it independently.
  - signal: SUV
    documented: >
      Appendix Table A.1, citing Garfinkel (2009): "Difference between actual
      volume and predicted volume. Predicted volume is from a regression of
      previous month's daily volume on a constant and the absolute values of
      positive and negative previous month's returns. Unexplained volume is
      standardized by the standard deviation of the residuals from the
      regression."
    implemented: >
      The regression is estimated on the current month's trading days, and the
      signal is the last trading day's standardised residual from it -- one
      day's volume surprise, not the month's.
    evidence: >
      Against the paper's own firm-month panel (t_by_n/SUV.mat, shared by
      Andrea Tamoni in September 2026) the last day's within-month residual
      matches at Spearman 0.9999 with a ratio of 1.0000; agreement with the
      published decile weights 0.982. The documented reading, and every
      month-level variant of it, agrees with the panel at between -0.001 and
      -0.04, and with the published weights at 0.07.
    consequence: >
      The decile a firm is sorted into is decided by its volume on one trading
      day relative to that month's own fit. This is the signature of a daily
      series collapsed to monthly by taking the last observation rather than
      the month's value, and the same signature appears in DTO. As published,
      SUV is not Garfinkel's standardised unexplained volume.
  - signal: DTO
    documented: >
      Appendix Table A.1, citing Garfinkel (2009): "Daily volume (vol) to
      shares outstanding (shrout) minus the daily market turnover and
      detrended by the 180 trading day median", with Nasdaq volume scaled down
      by 50% before 1997 and 38% after.
    implemented: >
      The last trading day's turnover less the mean of its own previous 180
      trading days. No market turnover is subtracted, Nasdaq volume is not
      scaled, and the detrending uses a mean, not a median.
    evidence: >
      Spearman 0.998 against the paper's panel (Pearson 0.997); agreement with
      the published decile weights 0.985. The 180-day median instead of the
      mean gives 0.888 against the panel; subtracting the market's turnover or
      scaling Nasdaq volume lowers it further (the documented form, sampled on
      the last day, 0.56-0.64; averaged over the month, 0.18-0.31).
    consequence: >
      Without the market adjustment the signal is a firm's own one-day
      turnover shock rather than abnormal turnover in Garfinkel's sense, and
      as with SUV a single day stands in for the month.

- key: B
  title: The appendix cannot be built from
  blurb: >
    The implementation is defensible, often the only thing possible, but
    somebody working from Table A.1 alone would get a materially different
    series. Agreement scores below are what the literal reading achieves
    against what the data does.
  items:
  - signal: SPREAD
    documented: '"Average daily bid-ask spread in the previous month", citing Chung and Zhang (2014), whose estimator is the quoted spread.'
    implemented: >
      Each trading day contributes its high-low range, 2(high-low)/(high+low),
      if it has one and its quoted spread otherwise; the month is the mean
      over those days, with no minimum number of days.
    evidence: >
      literal reading 0.02, range alone 0.94. Built day by day, every
      firm-month in 1975, 1985, 1995 and 2005 agrees with the paper's panel
      within 1% and none the panel has is missing.
    consequence: >
      Not a defect in the data -- CRSP carries quotes for 9% of daily rows in
      the 1960s and 53% in the 1980s, so a quoted spread cannot be computed
      over this sample at all -- but the citation points at an estimator the
      sample cannot support, and the substitution is unstated.
  - signal: sdDVOL
    documented: '"Standard deviation of residuals from a regression of daily volume (vol) on a constant", i.e. the dispersion of daily share volume in levels.'
    implemented: >
      The standard deviation of the log of daily *dollar* volume over the days
      that have volume; zero-volume days are left out.
    evidence: >
      share volume in levels 0.06, log share volume 0.63, log dollar volume
      0.87. Against the paper's panel, including zero-volume days as ln(1 + 0)
      disagrees by a factor of 1.6 to 5 for every firm-month that has one
      (27% of them); leaving them out matches.
    consequence: >
      Three undocumented choices at once: the units, the logarithm, and the
      exclusion of zero-volume days. In levels the measure captures firm size
      rather than variability.
  - signal: dSOUT
    documented: '"Annual % change in shares outstanding (shrout)."'
    implemented: Growth in shrout multiplied by CRSP's cumulative share adjustment factor.
    evidence: "literal reading 0.51, implemented 0.97"
    consequence: >
      Taken literally the signal reads every two-for-one split as a 100%
      issuance. This is the largest gap between a literal reading and the data
      of any signal outside category A.
  - signal: ROIC
    documented: '"...to the sum of common equity (ceq), total liabilities (lt), and cash and short-term investments (che)."'
    implemented: Cash is subtracted from invested capital, not added.
    evidence: "as worded 0.64, as implemented 0.93"
    consequence: >
      Here the wording is wrong and the implementation is right -- invested
      capital is capital tied up in the business, net of cash -- so this is a
      typo in the appendix rather than a problem with the data.
  - signal: BETA_d
    documented: '"The sum of the regression coefficients of daily excess returns on market excess returns and the lag of market excess returns." No estimation window is given.'
    implemented: >
      Estimated over the firm's last 249 trading days, the market's lag taken
      on the firm's own rows.
    evidence: >
      one month 0.35, six 0.62, twelve 0.94, twenty-four 0.63 on the published
      weights. Against the paper's panel, 249 of the firm's days puts 84% of
      firm-months within 1% with a rank correlation of 0.9996; 250 days 47%,
      calendar twelve months 24%.
    consequence: >
      The window is the difference between a usable signal and noise, and it is
      not stated. Separately, FNW's own entry under this name describes the
      Frazzini-Pedersen beta -- a correlation times a volatility ratio -- which
      is a different estimator from the Dimson sum A.1 describes.
  - signal: DP
    documented: '"Sum of monthly dividend over the last 12 months to last month''s price (prc)."'
    implemented: Dividends in dollars over the *current* month's market capitalisation.
    evidence: "per share over price 0.84, dollars over market cap 0.92"
    consequence: Minor, but per share the share count drifts through the year and the two are not the same quantity.
  - signal: TAN
    documented: The formula is given; the missing-data rule is not.
    implemented: Every component required non-missing.
    evidence: "zero-filling 0.48, requiring all 0.96"
    consequence: Zero-filling reads as "this firm holds no tangible assets" and sends firms with incomplete filings to the bottom decile.
  - signal: TNOVR
    documented: '"Volume (vol) over shares outstanding (shrout)."'
    implemented: The previous month's volume over the current month's shares outstanding.
    evidence: "as documented 0.71, with the one-month lag 0.978; Spearman 1.0000 against the paper's panel"
    consequence: >
      A one-month misalignment of numerator and denominator. Harmless for most
      firms, but a split or an issuance between the two months changes the
      share count without the volume, so the signal halves or jumps for
      exactly the firms whose turnover is in question.
  - signal: aBEME, aPM, aSAT, aSIZE
    documented: '"Industry level is defined as the Fama-French 48 industries."'
    implemented: >
      Twenty-seven industry groups that are not Fama-French 48, recovered from
      the panels themselves: within a month the value less its adjusted value
      is one constant per industry, and grouping SIC codes by that constant
      month after month gives 27 groups that never contradict one another. The
      SIC code is CRSP's name-history code (msenames), which reproduces the
      panel's own siccd for 99.5% of firm-months.
    evidence: >
      Fama-French 48 with the same inputs agrees with the published decile
      weights at 0.51 (aBEME), 0.45 (aSAT), 0.87 (aSIZE); the recovered scheme
      at 0.92, 0.91, 0.99. One recovered group holds 410 SIC codes spanning
      five FF48 industries (food, agriculture, textiles, clothing,
      construction); another 281 codes across building materials, machinery,
      steel, paper and household goods.
    consequence: >
      Coarser than FF48 across manufacturing and matching no published
      classification we tried (FF 5, 10, 12, 17, 30, 38, 48, 49; one- to
      three-digit SIC). It could be recovered only because the panels expose
      the cell means; from the appendix alone these four signals cannot be
      rebuilt.

- key: C
  title: The appendix drops a qualifier its own source insists on
  blurb: >
    Table A.1 is a condensation of Freyberger, Neuhierl and Weber. In a few
    places the condensation loses something that changes the answer.
  items:
  - signal: A2ME, E2P, S2P, BEME, SIZE
    documented: >
      FNW state the market capitalisation timing explicitly -- "as of December
      t-1" for A2ME, E2P and BEME, "as of December" for S2P, "of the previous
      month" for SIZE. Table A.1 says only "market capitalization (prc x
      shrout)" with no timing at all.
    implemented: The current month's market capitalisation.
    evidence: "contemporaneous 0.95-0.99 across the five, December of the prior year 0.61-0.97"
    consequence: >
      The data does not follow FNW here, and A.1 is silent rather than wrong.
      But anyone building these from FNW, as the citation invites, would use
      December and land a long way off -- Q falls from 0.98 to 0.61, E2P from
      0.97 to 0.69.
  - signal: Q
    documented: >
      FNW write "the market value of equity (SHROUT times PRC) minus cash and
      short-term investments (CEQ)" -- CEQ is common equity, not cash.
    implemented: Common equity, which is what CEQ means.
    evidence: null
    consequence: A typo in FNW that Table A.1 silently corrects. Recorded because it runs the other way.

- key: D
  title: Issues in the reported results rather than the signals
  blurb: Found while replicating the paper's own tables and out-of-sample tests.
  items:
  - signal: Table of characteristics-to-wedge mappings
    documented: 'Profitability alone is reported with an R-squared of exactly 0.00, alongside a non-zero coefficient of +0.13.'
    implemented: We obtain 0.18 on the same 114 extreme portfolios.
    evidence: "every other entry in that table replicates within a few points: PC3 0.705 against 0.76, PC6 0.752 against 0.77, FF5 0.704 against 0.74, BEME 0.550 against 0.67"
    consequence: A zero R-squared with a non-zero slope is hard to produce and is probably a reporting slip.
  - signal: aPM, dGS
    documented: Each is signed so its long-short earns a positive one-month alpha, and reported with a long and a short leg.
    implemented: Their one-month alphas in our data are 0.00012 and 0.0013 a month.
    evidence: "our sign convention agrees with the package for 55 of 57 characteristics; these are the two that differ"
    consequence: >
      For aPM especially the alpha is indistinguishable from zero, so which leg
      is "long" is arbitrary and the published long and short wedges for it
      could swap without anything being wrong.
  - signal: The out-of-sample firm-level correlation of 0.98
    documented: Firm wedges from a pre-1998 mapping correlate 0.98 with full-sample firm wedges, offered as evidence the approach is robust out of sample.
    implemented: Both series are linear functions of the same three principal components of the same firm characteristics, differing only in coefficients.
    evidence: >
      Refitting the mapping to portfolio wedges with HALF the spread gives firm
      wedges correlating 1.0000 with the correct ones; fitting to wedges plus
      noise of equal variance gives 0.9976.
    consequence: >
      A mapping that gets every magnitude wrong by a factor of two passes this
      test perfectly. It establishes that the coefficient vector is stable,
      which is a real if modest claim, but it never compares a prediction
      against a realised wedge.
  - signal: The out-of-sample portfolio correlation of 0.92
    documented: First-half portfolio wedges correlate 0.92 with full-sample wedges.
    implemented: The first half is one half of the full sample, so the two overlap by construction.
    evidence: >
      For two halves correlating rho, each correlates with the whole at about
      sqrt((1+rho)/2). At the paper's footnoted rho of 0.77 that is 0.94; at
      ours, 0.58, it is 0.89 and we observe 0.95.
    consequence: The 0.92 is close to implied by the 0.77 in the footnote. The footnote is the informative number, and it is the one we cannot reproduce.
  - signal: The mapping R-squared of 0.76
    documented: Three principal components explain 0.76 of portfolio price wedges.
    implemented: Computed on the 114 extreme deciles only.
    evidence: "on all 570 portfolios the same mapping gives 0.543 in sample and 0.411 leaving a characteristic family out; the direct rank regression gives 0.822 and 0.749 on the same portfolios"
    consequence: >
      Restricting to the extremes flatters three principal components
      specifically -- the gap to a direct regression is 0.09 on the extremes
      and 0.31 on all ten deciles. Most firms sit in the middle deciles.
  - signal: Time-split out-of-sample tests
    documented: Wedges are recomputed on subsamples of formation dates.
    implemented: The market price of risk is calibrated once on the full sample and carried over.
    evidence: >
      Carried over, early cohorts average -37 percentage points and late ones
      +33, a seventy-point flip that is purely the difference in realised
      market returns across the cut. Re-solving it within each half -- 3.9 to
      4.9 early against 2.4 to 2.9 late -- the flip disappears and root mean
      squared error falls from 37-77 points to 10-15.
    consequence: >
      Correlations are location-invariant so the paper's reported correlations
      are unaffected. It does matter for the Panel B investment-q regressions,
      which use out-of-sample firm wedges as a regressor in levels.

- key: E
  title: Looks like a discrepancy, is not
  blurb: Recorded so these are not re-opened. Each cost real time to resolve.
  items:
  - signal: The five momentum sorts
    documented: '"Cumulative return from 12 months to 2 months ago."'
    implemented: >
      The panel stores, on row t, the return over months t-11 to t-1 -- one
      month later than the name. The sort then lags every characteristic by a
      further month, so the signal a portfolio formed at t actually sorts on is
      the return from t-12 to t-2, exactly as documented.
    evidence: "storing the literal window instead drops agreement from 0.97 to 0.65, and for R_2_1 from 0.97 to 0.11"
    consequence: >
      NOT an error. The economics is right and the stated definition is what
      gets used; only the storage convention is undocumented. It matters
      enormously for anyone rebuilding the panel and not at all for the paper's
      results.
  - signal: R_12_2 stored as a gross return
    documented: A cumulative return.
    implemented: Stored as 1 + r rather than r; the median difference against ours is exactly 1.0000.
    evidence: null
    consequence: A units convention. Ranks are untouched, so no sort is affected.
  - signal: Market capitalisation units
    documented: null
    implemented: Stored in millions in the package and in thousands in CRSP, a factor of exactly 1000.
    evidence: null
    consequence: Value weighting is scale-invariant, so nothing is affected.
  - signal: The panel's row alignment
    documented: null
    implemented: >
      MainPart1.m slices the panel from one row *before* July 1926, so its rows
      are offset by a month relative to the obvious reading.
    evidence: >
      Comparing without noticing makes contemporaneous market equity look like
      a 3% match and lagged market equity a 91% match, which is backwards.
      Implementing the lagged version accordingly made the sorts worse -- 50
      verified characteristics down to 48, BEME from 0.97 to 0.84 -- which is
      what exposed the error.
    consequence: A trap for anyone comparing against the shipped panel, not a problem with the paper.
