    score: 0.521
    verdict: ff30 marginally best, none close
  - variant: one-digit, two-digit and three-digit SIC
    score: 0.477
    verdict: rejected
  - variant: Compustat historical SIC (sich), with and without CRSP fallback
    score: 0.506
    verdict: rejected
  - variant: Compustat header SIC from comp.company
    score: 0.468
    verdict: rejected
  - variant: a firm's modal SIC over its life
    score: 0.509
    verdict: rejected
  - variant: industry median instead of mean
    score: 0.511
    verdict: rejected
  - variant: capitalisation-weighted industry mean
    score: 0.227
    verdict: rejected
  - variant: industry mean over all of CRSP rather than common shares only
    score: 0.099
    verdict: rejected
  - variant: industry mean over NYSE firms only
    score: 0.384
    verdict: rejected
  - variant: industry mean over the larger half of each industry
    score: 0.401
    verdict: rejected
  - variant: ratio to the industry mean, and log of that ratio
    score: 0.44
    verdict: rejected
  - variant: standardised within industry (divided by the industry sd)
    score: 0.348
    verdict: rejected
  - variant: percentile rank within industry
    score: 0.421
    verdict: rejected
  - variant: cross-sectional rank less the industry mean rank
    score: 0.391
    verdict: rejected
  - variant: leave-one-out industry mean
    score: 0.512
    verdict: rejected
  - variant: aggregate industry ratio (sum of book over sum of market)
