- id: BETA_d
  name: The sum of the regression coefficients of daily excess returns on mark
  group: trading frictions
  source: lewellen2006
  frequency: monthly, sampled on the last trading day (daily inputs)
  inputs:
  - dlyret
  - ff.factors_daily mktrf and rf
  formula: |
    Over the firm's last 249 trading days ending on the month's last trading day, fit
        r_d - rf_d = a + b0 * mktrf_d + b1 * mktrf_{d-1} + e_d
    where mktrf_{d-1} is the market's value on the firm's previous trading day, and
        BETA_d[t] = b0 + b1.
    At least 10 of the firm's days in the window; a firm with a shorter history uses
    what it has.
  notes: 'RESOLVED against the paper''s own panel (t_by_n/BETA_d.mat): 84% of firm-months within
    1%, rank correlation 0.9996, median ratio 1.0000. The window is 249 of the firm''s own trading
    rows, which is what a 250-day window gives once the lag consumes its first day; 248 or 250
    rows halve the agreement (0.49 and 0.47), calendar twelve months gives 0.24, and a window
    counted on the market''s calendar rather than the firm''s rows 0.76. The firm-months outside
    1% have betas below 0.2 in absolute value, where a relative criterion is harsh, and thin out
    from 45% in the first year of the daily sample to 5-18% after; the ranking is exact. Table
    A.1 states no window at all. Over the full panel: within 1% for 89.7% of firm-months, rank
    correlation 0.9994, median ratio 1.0002.'
  tried:
  - variant: estimated over one month
    score: 0.353
    verdict: rejected
  - variant: six months
    score: 0.617
    verdict: rejected
  - variant: twenty-four and sixty months
    score: 0.631
    verdict: rejected
  - variant: calendar twelve months of daily data (the previous form)
    score: 0.952
    verdict: 'superseded: 24% of firm-months within 1% of the panel'
  - variant: 250, 251, 252, 248, 245 or 240 of the firm's trading days
    score: null
    verdict: 47%, 35%, 28%, 49%, 26%, 13% within 1%; 249 gives 84%
  - variant: 250 days on the market calendar, thin traders having fewer observations
    score: null
    verdict: 76% at 249 days, 43% at 250; the window counts the firm's own days
  - variant: CRSP value-weighted or equal-weighted index instead of the Fama-French market factor
    score: null
    verdict: 10% and 2% within 1%, ratio 1.03 and 1.17; rejected
  - variant: window ending the day before the month's last trading day
    score: null
    verdict: 28%; the window ends on the last day
  - variant: plain market beta without the lag term
    score: null
    verdict: 2% within 1%, ratio 0.80; the panel is the Dimson sum

