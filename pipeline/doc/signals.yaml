- id: SUV
  name: Standardised unexplained volume
  group: trading frictions
  source: Garfinkel (2009)
  frequency: monthly (daily inputs)
  inputs: [dlyvol, dlyret]
  formula: |
    Within a month, regress log(1 + daily volume) on a constant and the
    absolute values of positive and negative daily returns:
        ln(1+v_i) = a + b*max(r_i,0) + c*|min(r_i,0)| + e_i
    Estimated on the previous month and applied to the current one:
        SUV[t] = ( sum_i ln(1+v_i) - predicted ) / ( n * sd(e) )
    with predicted and sd(e) from month t-1's fit. At least 15 days required.
  notes: >
    UNRESOLVED at 0.07. Neither Chen and Zimmermann nor JKP carry a Garfinkel
    signal, so there is no reference implementation anywhere. The level of the
    decile weights comes out close (8.85 against a published 8.94 on decile
    one) while the month-to-month variation does not, which is the signature of
    a measure that is right in construction but wrong in timing or in which
    residual is taken. Full daily data has been pulled to test day-level
    variants the monthly moments cannot express.
  tried:
    - {variant: "regression in volume levels rather than logs", score: 0.080, verdict: rejected}
    - {variant: "estimation window of 1, 6, 12 and 24 months applied out of sample", score: 0.092, verdict: "rejected at every length"}
    - {variant: "previous month taken on a dense grid so the lag cannot cross a gap", score: 0.072, verdict: rejected}
    - {variant: "in-sample residual dispersion rather than an out-of-sample residual", score: 0.002, verdict: rejected}
    - {variant: "standardised by sqrt(n) rather than n", score: 0.073, verdict: rejected}

- id: DTO
  name: Detrended turnover
  group: trading frictions
  source: Garfinkel (2009)
  frequency: monthly (daily inputs)
  inputs: [dlyvol, shrout, primaryexch]
  formula: |
    daily turnover, with Nasdaq volume scaled by 0.50 before 1997 and 0.38
    after, less the cross-sectional mean that day, then detrended by
    subtracting its own median over the previous 180 trading days.
  notes: >
    UNRESOLVED at 0.36, and the cause is known: the 180-trading-day median is
    not a moment of any month, so it cannot come out of the server-side
    aggregation the other eight daily characteristics use. It is currently
    approximated by a rolling median of nine monthly means. Full daily data has
    been pulled to compute the true median.
  tried:
    - {variant: "rolling median over 6, 9 and 12 months of monthly means", score: 0.367, verdict: "best available approximation so far"}

- id: aBEME
  name: Industry-adjusted book to market
  group: value
  source: Asness, Porter and Stevens (2000)
  frequency: monthly
  inputs: [be, cap, siccd]
  formula: |
    aBEME = BEME - mean(BEME) within the firm's Fama-French 48 industry that
    month, equal-weighted over ordinary common shares that have BEME.
  notes: >
    UNRESOLVED at 0.51, and the puzzle is that its parent BEME verifies at 0.97,
    so the adjustment itself is what fails. Our decile one matches (3.93 against
    a published 3.77) while decile ten does not (13.13 against 18.30): the
    published adjustment removes far less of the growth tilt than ours does. The
    search below has been exhaustive and nothing closes it. Most likely the
    industry classification comes from a source we do not have -- plausibly
    Baba-Yara, Boons and Tamoni's own file, since the paper says the
    characteristic set comes from that project as well as from FNW.
  tried:
    - {variant: "Fama-French 5, 10, 12, 17, 30, 38, 48 and 49 industries", score: 0.521, verdict: "ff30 marginally best, none close"}
    - {variant: "one-digit, two-digit and three-digit SIC", score: 0.477, verdict: rejected}
    - {variant: "Compustat historical SIC (sich), with and without CRSP fallback", score: 0.506, verdict: rejected}
    - {variant: "Compustat header SIC from comp.company", score: 0.468, verdict: rejected}
    - {variant: "a firm's modal SIC over its life", score: 0.509, verdict: rejected}
    - {variant: "industry median instead of mean", score: 0.511, verdict: rejected}
    - {variant: "capitalisation-weighted industry mean", score: 0.227, verdict: rejected}
    - {variant: "industry mean over all of CRSP rather than common shares only", score: 0.099, verdict: rejected}
    - {variant: "industry mean over NYSE firms only", score: 0.384, verdict: rejected}
    - {variant: "industry mean over the larger half of each industry", score: 0.401, verdict: rejected}
    - {variant: "ratio to the industry mean, and log of that ratio", score: 0.440, verdict: rejected}
    - {variant: "standardised within industry (divided by the industry sd)", score: 0.348, verdict: rejected}
    - {variant: "percentile rank within industry", score: 0.421, verdict: rejected}
    - {variant: "cross-sectional rank less the industry mean rank", score: 0.391, verdict: rejected}
    - {variant: "leave-one-out industry mean", score: 0.512, verdict: rejected}
    - {variant: "aggregate industry ratio (sum of book over sum of market)", score: 0.226, verdict: rejected}
    - {variant: "partial adjustment, subtracting 0.25, 0.5 or 0.75 of the industry mean", score: 0.458, verdict: rejected}
    - {variant: "previous year's industry mean", score: 0.343, verdict: rejected}

- id: aSAT
  name: Industry-adjusted asset turnover
  group: profitability
  source: Soliman (2008)
  frequency: annual
  inputs: [sale, at, siccd]
  formula: |
    aSAT = SAT - mean(SAT) within the Fama-French 48 industry that month,
    equal-weighted over ordinary common shares.
  notes: >
    UNRESOLVED at 0.45. Parent SAT verifies at 0.90. Same search as aBEME.
  tried:
    - {variant: "the full classification and operation search listed under aBEME", score: 0.448, verdict: "ff48 demeaning best, none close"}
    - {variant: "aggregate industry ratio (sum of sales over sum of assets)", score: 0.264, verdict: rejected}
    - {variant: "partial adjustment at 0.25, 0.5, 0.75", score: 0.261, verdict: rejected}

- id: aPM
  name: Industry-adjusted profit margin
  group: profitability
  source: Soliman (2008)
  frequency: annual
  inputs: [oiadp, sale, siccd]
  formula: |
    aPM = PM - mean(PM) within the Fama-French 48 industry that month,
    equal-weighted over ordinary common shares.
  notes: >
    UNRESOLVED at 0.28, the worst of the industry-adjusted three even though
    parent PM verifies at 0.97. Separately, its one-month alpha is 0.00012 a
    month, statistically indistinguishable from zero, so which leg is "long" is
    not well defined for this characteristic in either dataset. Coverage is also
    poor in recent years (76% missing in 2024-25) and should be looked at.
  tried:
    - {variant: "the full classification and operation search listed under aBEME", score: 0.340, verdict: "two-digit SIC marginally best, none close"}
    - {variant: "partial adjustment at 0.25, 0.5, 0.75", score: 0.261, verdict: rejected}
    - {variant: "industry mean over the larger half, and the prior year's mean", score: 0.146, verdict: rejected}

- id: aSIZE
  name: Industry-adjusted size
  group: trading frictions
  source: Asness, Porter and Stevens (2000)
  frequency: monthly
  inputs: [cap, siccd]
  formula: |
    aSIZE = SIZE - mean(SIZE) within the Fama-French 48 industry that month,
    equal-weighted over ordinary common shares.
  notes: >
    Just above the threshold at 0.85, but its wedge is still 13 points from the
    paper's on the long leg -- the widest gap of any characteristic that passes
    the construction check. Treat as unresolved in practice.
  tried:
    - {variant: "Fama-French 10 and 30 industries", score: 0.866, verdict: "marginally better than 48, within noise"}
    - {variant: "industry median instead of mean", score: 0.877, verdict: "marginally better, not adopted"}
    - {variant: "log size demeaned within industry", score: 0.754, verdict: rejected}
    - {variant: "partial adjustment at 0.75", score: 0.872, verdict: "marginally better, not adopted"}
    - {variant: "capitalisation-weighted industry mean", score: 0.317, verdict: rejected}

