    The residual standard deviation divides the residual sum of squares by n - 1, not by
    n - 4.
  notes: 'Emphatically monthly, unlike BETA_d: 0.93 at one month against 0.58 at twelve. JKP corroborate,
    carrying ivol_ff3_21d at a 21-day window, and our series correlates 0.997 with theirs. Against
    the paper''s panel the version dividing by n - 4 ran 8.45% high at the median month; (ours/theirs)^2
    by number of trading days is (n - 1)/(n - 4) to four decimals at every n from 15 to 23, so
    the panel is the sample standard deviation of the residuals. Ranks move very little (rank
    correlation was already 0.9997). Over the full panel: within 1% for 75.8% of firm-months,
    rank correlation 0.9998, median ratio 1.0000; the remainder is the factor vintage on small
    values.'
  tried:
  - variant: estimated over twelve months
    score: 0.582
    verdict: rejected
  - variant: residual variance with n - 4 degrees of freedom
    score: 0.955
    verdict: a convention, not an error; the panel divides by n - 1

