# Construction log for the 57 price-wedge anomaly signals.
#
# Source of truth, hand-edited as findings land. `build_signal_log.py` fills in
# agreement scores and wedge errors from the latest validation run and renders
# signals.tex from this file. Do not paste numbers into the entries below that
# the script can compute.
#
# Conventions that apply to every signal unless its entry says otherwise:
#
#   sample        US common stock on NYSE, AMEX or Nasdaq. In CRSP's CIZ schema:
#                 sharetype NS, securitytype EQTY, securitysubtype COM,
#                 usincflg Y, issuertype in (CORP, ACOR), primaryexch in
#                 (N, A, Q, R). Equivalent to share codes 10 and 11.
#   timing        annual Compustat variables are merged with a six-month lag;
#                 monthly variables enter as of the month named. The sort then
#                 lags the characteristic one further month, so a signal stored
#                 on row t is what a sort formed at t+1 uses.
#   market equity CRSP mthcap, current month, converted from thousands to
#                 millions to match Compustat. NOT December of the prior year,
#                 despite Freyberger-Neuhierl-Weber saying so: see BEME.
#   deltas        "d x" means x minus its value in the prior fiscal year.
#   ranks         percentile rank within the month's cross-section, on [0,1].
#
# Fields: id, name, group, source, frequency, inputs, formula, notes, tried.
# `tried` entries are {variant, score, verdict}; score is the decile-weight
# agreement that variant achieved, so they are comparable to the headline.

signals:

# ============================ resolved this round ============================

- id: OA
  name: Operating accruals
  group: intangibles
  source: Sloan (1996), per Appendix Table A.1
  frequency: annual
  inputs: [act, che, lct, dlc, txp, dp, at]
  formula: |
    OA = ( d act - d che - ( d lct - d dlc - d txp - dp ) ) / at[t-1]
    where d txp treats a missing value as zero.
    Note the placement of dp: it sits INSIDE the bracket, so expanding gives
    OA = d act - d che - d lct + d dlc + d txp + dp, i.e. depreciation is
    ADDED to accruals.
  notes: >
    This is not Sloan (1996) and not what Table A.1's own wording says
    ("changes in non-cash working capital minus depreciation"). It is
    nevertheless unambiguously what the paper's data does: netting depreciation
    out gives agreement 0.286, adding it gives 0.963, and decile one's share of
    market capitalisation comes out at 5.29% against a published 5.30%. Chen
    and Zimmermann's PctAcc.do carries the identical bracket placement while
    their Accruals.do does not, which suggests a shared transcription. WORTH
    RAISING WITH THE COAUTHORS: as published, OA and AOA are not accruals net
    of depreciation, so capital-intensive firms sort toward the high-accrual
    leg because of their depreciation rather than away from it.
  tried:
    - {variant: "Sloan's grouping with dp subtracted outside the bracket", score: 0.286, verdict: rejected}
    - {variant: "literal reading of A.1, all three current-liability terms subtracted", score: 0.065, verdict: rejected}
    - {variant: "dp subtracted, scaled by average rather than lagged total assets", score: 0.251, verdict: rejected}
    - {variant: "dp subtracted, every delta zero-filled", score: 0.163, verdict: rejected}
    - {variant: "change in net operating assets", score: 0.234, verdict: rejected}
    - {variant: "change in working capital from wcap directly", score: -0.058, verdict: rejected}
    - {variant: "cash-flow statement form, ni less oancf, over average assets", score: 0.087, verdict: rejected}
    - {variant: "cash-flow form with balance-sheet fallback", score: 0.269, verdict: rejected}
    - {variant: "scaled by sales, by absolute earnings, by current assets", score: 0.154, verdict: rejected}
    - {variant: "winsorised 1/99 monthly, or |OA| capped at 1, 0.5, 0.3", score: 0.065, verdict: "no effect; outliers are not the cause"}
    - {variant: "JKP oaccruals_at taken directly from their library", score: 0.278, verdict: "better than ours was, worse than the fix"}
    - {variant: "shifted +/- 6 months against the published series", score: null, verdict: "no peak; not a timing offset"}

- id: AOA
  name: Absolute operating accruals
  group: intangibles
  source: Bandyopadhyay, Huang and Wirjanto (2010)
  frequency: annual
  inputs: [act, che, lct, dlc, txp, dp, at]
  formula: |
    AOA = |OA|, with OA exactly as above (depreciation added, not subtracted).
  notes: >
    Follows OA mechanically. Neither Chen and Zimmermann nor Jensen, Kelly and
    Pedersen carry a Bandyopadhyay signal, so there is no third implementation
    to compare against; it is verified only through OA.
  tried:
    - {variant: "absolute value of every rejected OA variant above", score: 0.087, verdict: rejected}

- id: DP
  name: Dividend yield
  group: value
  source: Litzenberger and Ramaswamy (1979)
  frequency: monthly
  inputs:
  - ret
  - retx
  - cap
  formula: |
    dollars paid in month s = (ret[s] - retx[s]) * cap[s-1]
    DP[t] = sum of those dollars over months t-11..t, divided by cap[t],
    requiring at least six of the twelve months.
  notes: Dividends in dollars over market capitalisation, not dividends per share over price.
    Per share the share count drifts through the year and agreement falls to 0.841. JKP's div12m_me,
    which is this same quantity, scores 0.928 against the package, and building it natively gives
    0.924. Against the paper's own panel (t_by_n/DP.mat) the two agree exactly where both are
    zero (53% of firm-months) but differ by more than 1% for three quarters of the non-zero ones,
    with the ratio spread from 0.87 to 1.10 rather than at any fixed factor, and the paper carries
    a value for 26% fewer firm-months than we do. No formula variant tried (below) narrows that,
    so the difference is in the dividend series itself, most plausibly dividends taken from CRSP's
    distribution events rather than from ret - retx. Verified at the sort level; the short leg
    is the widest gap among verified characteristics (4 points).
  tried:
  - variant: dividends per share over price (twelve-month sum)
    score: 0.841
    verdict: rejected
  - variant: per-share dividends restated for splits before summing
    score: 0.735
    verdict: rejected; the more coherent calculation agrees worse
  - variant: sum of twelve monthly dividend yields, no price
    score: 0.743
    verdict: rejected
  - variant: cash distributions from crsp.stkdistributions over price
    score: 0.348
    verdict: rejected despite being the more principled source
  - variant: dollar dividends over lagged rather than current market cap
    score: 0.869
    verdict: rejected
  - variant: JKP div_me (one month), div6m_me, div_at
    score: 0.652
    verdict: rejected
  - variant: dollar dividends over the previous month's market capitalisation
    score: null
    verdict: within 1% of the panel for 9% of non-zero firm-months against 25% for the current
      form
  - variant: requiring all twelve months, or any one, instead of six
    score: null
    verdict: 25% within 1% either way; no change
  - variant: per-share dividends over the month-end price
    score: null
    verdict: 28% within 1%, rank correlation 0.973 against 0.976; not better

- id: ATO
  name: Asset turnover
  group: profitability
  source: Soliman (2008)
  frequency: annual
  inputs: [sale, at, che, ivao, dlc, dltt, mib, pstk, ceq]
  formula: |
    operating assets      = at - che - ivao        (che, ivao missing -> 0)
    operating liabilities = at - dlc - dltt - mib - pstk - ceq
                            (dlc, dltt, mib, pstk missing -> 0; ceq REQUIRED)
    net operating assets  = operating assets - operating liabilities
    ATO = sale / NOA[t-1]
  notes: >
    Common equity must be required rather than zero-filled. Filled, operating
    liabilities collapse to assets less debt, net operating assets go to nearly
    zero, and anything divided by them explodes into the end deciles. Agreement
    0.78 filled against 0.92 required. This is Chen and Zimmermann's convention
    in RetNOA.do, where dlc, dltt, mib and pstk are zero-filled and ceq is not.
  tried:
    - {variant: "ceq zero-filled like the other liability terms", score: 0.780, verdict: rejected}
    - {variant: "contemporaneous rather than lagged net operating assets", score: 0.582, verdict: rejected}
    - {variant: "operating assets without subtracting ivao", score: 0.558, verdict: rejected}
    - {variant: "observations with non-positive NOA discarded", score: 0.494, verdict: rejected}
    - {variant: "Soliman's component-built operating assets (rect+invt+aco+ppent+intan-ap-lco-lo), averaged", score: 0.241, verdict: rejected}
    - {variant: "lagged sales over lagged NOA", score: 0.625, verdict: rejected}

- id: RNA
  name: Return on net operating assets
  group: profitability
  source: Soliman (2008)
  frequency: annual
  inputs: [oiadp, at, che, ivao, dlc, dltt, mib, pstk, ceq]
  formula: |
    RNA = oiadp / NOA[t-1], with NOA exactly as defined under ATO
    (ceq required, the other liability terms zero-filled).
  notes: >
    Same common-equity point as ATO: 0.76 with ceq filled, 0.95 required.
  tried:
    - {variant: "ceq zero-filled", score: 0.758, verdict: rejected}
    - {variant: "contemporaneous NOA", score: 0.690, verdict: rejected}
    - {variant: "operating assets without ivao", score: 0.551, verdict: rejected}
    - {variant: "non-positive NOA discarded", score: 0.538, verdict: rejected}
    - {variant: "Soliman component-built operating assets", score: 0.411, verdict: rejected}

- id: dSOUT
  name: Change in shares outstanding
  group: investment
  source: Pontiff and Woodgate (2008)
  frequency: monthly
  inputs: [shrout, mthcumfacshr]
  formula: |
    adjusted shares s[t] = shrout[t] * mthcumfacshr[t]
    dSOUT[t] = 100 * ( s[t] / s[t-12] - 1 )
  notes: >
    CRSP's share counts are not split-adjusted, so raw growth reads every split
    as a 100% issuance. The cumulative share factor is the exact adjustment.
  tried:
    - {variant: "raw shrout growth, unadjusted for splits", score: 0.513, verdict: rejected}
    - {variant: "split adjustment backed out of market cap and the ex-dividend return", score: 0.883, verdict: "close, superseded"}

- id: dPIA
  name: Change in plant and inventory over assets
  group: investment
  source: Lyandres, Sun and Zhang (2008)
  frequency: annual
  inputs: [ppegt, invt, at]
  formula: |
    dPIA = ( d ppegt + d invt ) / at[t-1],
    where each delta treats a missing component as no change (zero) rather than
    discarding the firm.
  tried:
    - {variant: "both deltas required non-missing", score: 0.777, verdict: rejected}
    - {variant: "scaled by average rather than lagged assets", score: 0.771, verdict: rejected}
    - {variant: "net rather than gross plant (ppent)", score: 0.493, verdict: rejected}
    - {variant: "scaled by lagged (ppegt + invt)", score: 0.420, verdict: rejected}

- id: TNOVR
  name: Share turnover
  group: trading frictions
  source: Datar, Naik and Radcliffe (1998)
  frequency: monthly
  inputs:
  - vol
  - shrout
  formula: |
    TNOVR[t] = vol[t-1] / shrout[t]
    the previous month's share volume over this month's shares outstanding, both from
    the CRSP monthly file.
  notes: 'RESOLVED against the paper''s panel: Spearman 1.0000; agreement with the published decile
    weights 0.978 (a three-month average gave 0.79). The one-month lag of volume against the share
    count is what the data does; Table A.1 ("volume over shares outstanding") does not mention
    it and no reason for it suggests itself. Recorded under discrepancies, category B.'
  tried:
  - variant: vol[t]/shrout[t], as documented
    score: 0.707
    verdict: rejected
  - variant: three-month average of vol/shrout
    score: 0.79
    verdict: rejected; was the best available before the panel
  - variant: twelve-month average
    score: 0.699
    verdict: rejected
  - variant: mean daily turnover within the month
    score: 0.706
    verdict: rejected
  - variant: Nasdaq volume scaled down 50% pre-1997 and 38% after
    score: 0.679
    verdict: rejected
  - variant: dollar volume over market cap
    score: 0.708
    verdict: rejected
  - variant: JKP turnover_126d
    score: 0.713
    verdict: rejected

- id: SUV
  name: Standardised unexplained volume
  group: trading frictions
  source: Garfinkel (2009), per Appendix Table A.1
  frequency: monthly, sampled on the last trading day (daily inputs)
  inputs:
  - dlyvol
  - dlyret
  formula: |
    On the trading days d of month t, the last day L included, fit by least squares
        v_d = a + b * max(r_d, 0) + c * max(-r_d, 0) + e_d
    with v_d the day's share volume and r_d its return. Then
        SUV[t] = e_L / sqrt( sum_d e_d^2 / (n - 1) ),
    n the number of trading days in the month, at least 5.
  notes: 'RESOLVED against the paper''s own panel (t_by_n/SUV.mat): Spearman 0.9999, Pearson 0.9998,
    and the ratio of the panel''s values to ours is 1.0000 at every quantile (n - 3 in the denominator
    gives 1.054, n gives 0.976; what remains is float32 rounding in our daily file). Agreement
    with the published decile weights 0.982; decile one 8.94% against a published 8.94%. This
    is not Garfinkel''s measure and not what Table A.1 describes: there the regression is estimated
    on the previous month and the surprise is the current month''s volume; in the data the regression
    is estimated on the current month and the surprise is the last trading day''s. Recorded under
    discrepancies, category A.'
  tried:
  - variant: regression in volume levels rather than logs
    score: 0.08
    verdict: rejected
  - variant: estimation window of 1, 6, 12 and 24 months applied out of sample
    score: 0.092
    verdict: rejected at every length
  - variant: previous month taken on a dense grid so the lag cannot cross a gap
    score: 0.072
    verdict: rejected
  - variant: in-sample residual dispersion rather than an out-of-sample residual
    score: 0.002
    verdict: rejected
  - variant: standardised by sqrt(n) rather than n
    score: 0.073
    verdict: rejected
  - variant: 'documented reading at the daily level: month''s mean (or sum over sqrt n) of daily
      standardised residuals from a trailing 63, 126 or 252-day fit, in volume, turnover or logs'
    score: null
    verdict: Spearman against the panel between -0.001 and -0.04; rejected
  - variant: last day's residual from a trailing window of 21, 42, 63, 90 days including the day
    score: null
    verdict: 'Spearman 0.990, 0.868, 0.809, 0.768: shorter is better, which pointed at the calendar
      month'
  - variant: trailing 63, 126, 252 days ending the day before
    score: null
    verdict: Spearman 0.803, 0.731, 0.674; rejected
  - variant: plain z-score of the last day's volume against a trailing window, no regression
    score: null
    verdict: Spearman 0.75; rejected
  - variant: log(1 + volume) or turnover as the dependent variable, within the month
    score: null
    verdict: Spearman 0.902 and 0.998 against 1.000 for share volume

- id: DTO
  name: Detrended turnover
  group: trading frictions
  source: Garfinkel (2009), per Appendix Table A.1
  frequency: monthly, sampled on the last trading day (daily inputs)
  inputs:
  - dlyvol
  - shrout (daily)
  formula: |
    turn_d = dlyvol_d / shrout_d                          (daily share turnover)
    DTO[t] = turn_L - mean( turn_d : d in the 180 trading days before L )
    L is the last trading day of month t; the mean needs at least 90 of the 180 days.
    No market turnover is subtracted, no Nasdaq volume scaling, no median, and no
    averaging over the month: the value on one day is the month's signal.
  notes: 'RESOLVED against the paper''s own panel (t_by_n/DTO.mat, shared by Andrea Tamoni in
    September 2026): Spearman 0.998, Pearson 0.997 (the panel''s values are ours times 500, a
    units convention that leaves every rank unchanged); agreement with the published decile weights
    0.985, decile one 6.42% of market capitalisation against a published 6.50%. This is not what
    Table A.1 describes -- "daily volume to shares outstanding minus the daily market turnover
    and detrended by the 180 trading day median", with Nasdaq volume scaled down -- and each documented
    element lowers the agreement (below). Recorded under discrepancies, category A.'
  tried:
  - variant: documented form, the 180-day median approximated by a rolling median of monthly means
    score: 0.367
    verdict: rejected; rank correlation with the panel 0.28
  - variant: last day, turnover less its 180-day median (120 and 252 days similar)
    score: null
    verdict: Spearman 0.888 against the panel; the mean gives 0.998
  - variant: last day, (turnover - median)/median, and log turnover less log median
    score: null
    verdict: Spearman 0.78 and 0.80; rejected
  - variant: subtracting the day's market turnover, and scaling Nasdaq volume by 0.50/0.38 (last
      day, median-detrended)
    score: null
    verdict: 'Spearman against the panel: neither 0.888; Nasdaq scaling alone 0.877; value-weighted
      market turnover subtracted 0.739, equal-weighted 0.666; both with Nasdaq scaling 0.643 and
      0.564. Neither is in the data.'
  - variant: the month's mean of the daily series instead of its last day
    score: null
    verdict: rejected; the panel is the last day's value

- id: aBEME
  name: Industry-adjusted book to market
  group: value
  source: Asness, Porter and Stevens (2000)
  frequency: monthly
  inputs:
  - beme
  - siccd (crsp.msenames name history)
  formula: |
    aBEME[t] = BEME[t] - mean( BEME[t] over ordinary common shares in the same industry that month )
    Equal-weighted over the firms that have BEME. The industry is the paper's own scheme: 27
    groups of SIC codes recovered from its panels (raw/their_industry_table.json), the SIC
    code being the CRSP name-history code (crsp.msenames) in force that month. A code the
    table does not cover leaves aBEME missing (1.8% of firm-months).
    Recovery: within a month, X - aX is one constant across the firms of an industry;
    grouping SIC codes by that constant, month after month, gives 27 groups and no
    code-month pair that sits in two of them.
  notes: 'RESOLVED at 0.917 against the published decile weights once the industry scheme was
    recovered from the paper''s panels (Fama-French 48 with the same inputs: see below). Table
    A.1 says the industries are Fama-French 48; the data''s cells are 27 groups that align with
    FF48 only in part -- one group holds 410 SIC codes spanning food, agriculture, textiles, clothing
    and construction, another 281 codes across building materials, machinery, steel, paper and
    household goods. The SIC source matters as well: the name-history code reproduces the panel''s
    own siccd for 99.5% of firm-months. Recorded under discrepancies, category B.'
